<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Знання, навички і ШІ для людини, яка має мету">
  <meta name="theme-color" id="theme-color" content="#f6f4ef">
  <title>Компас</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Компас">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="./styles.css">
  <!-- Тема до першого малювання, щоб не було спалаху світлого екрана -->
  <script>
    try {
      var pref = (JSON.parse(localStorage.getItem('kompas:v1') || '{}').theme) || 'system';
      var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#/home" class="brand" aria-label="Компас — на головну">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
      <span>Компас</span>
    </a>
    <a href="#/settings" class="icon-btn" aria-label="Налаштування">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </a>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Розділи">
    <div class="tabbar-inner">
      <a class="tab" data-tab="sens" href="#/sens">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
        <span>Сенс</span>
      </a>
      <a class="tab" data-tab="people" href="#/people">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Людина</span>
      </a>
      <a class="tab" data-tab="tools" href="#/tools">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
        <span>ШІ</span>
      </a>
      <a class="tab" data-tab="prompts" href="#/prompts">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
        <span>Промпти</span>
      </a>
      <a class="tab" data-tab="projects" href="#/projects">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
        <span>Проєкти</span>
      </a>
    </div>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Для роботи «Компаса» увімкніть JavaScript.</p></noscript>

  <script src="./data.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/screens/home.js"></script>
  <script src="./js/screens/sens.js"></script>
  <script src="./js/screens/people.js"></script>
  <script src="./js/screens/tools.js"></script>
  <script src="./js/screens/prompts.js"></script>
  <script src="./js/screens/projects.js"></script>
  <script src="./js/screens/settings.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
